<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>encrypt.js test</title></head>
<body>
<pre id="out">Running...</pre>
<script src="../src/engine/encrypt.js"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  const TEST = 'Hello, Blue Prince! Round-trip test.';
  try {
    const b64 = await es3Encrypt(TEST);
    const decrypted = await es3Decrypt(b64);
    const ok = decrypted === TEST;
    out.textContent = [
      'JS round-trip : ' + (ok ? 'PASS' : 'FAIL'),
      'Input         : ' + TEST,
      'Decrypted     : ' + decrypted,
      'B64 (for py)  : ' + b64,
    ].join('\n');
  } catch(e) {
    out.textContent = 'ERROR: ' + e;
  }
})();
</script>
</body>
</html>
